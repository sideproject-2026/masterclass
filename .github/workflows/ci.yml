name: CI

# Every push to main and every pull request. Nothing merges without this green.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run — no point finishing a build
# for a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # Reads global.json, so CI and local machines use the same pinned SDK band.
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # dotnet-ef is pinned in .config/dotnet-tools.json and must match the EF Core major.
      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors is set in Directory.Build.props, so CI inherits it.
      # This is also where NU1903 (vulnerable transitive packages) fails the build.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Includes Lms.ArchitectureTests (module boundaries, enforced here rather than by review)
      # and Lms.IntegrationTests, which starts a real PostgreSQL through Testcontainers.
      # ubuntu-latest ships a running Docker daemon, so no service container is needed.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (TanStack Start)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ci, not install: fails if package-lock.json and package.json disagree.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
